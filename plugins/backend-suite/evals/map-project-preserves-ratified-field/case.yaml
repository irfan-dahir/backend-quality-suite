schema_version: "1.0"
name: map-project-preserves-ratified-field
description: >
  A field a human already ratified is left exactly as it was. The prompt
  disagrees with the ratified value on purpose, so the skill has to report the
  disagreement rather than resolve it. `count:1` on "approved" is the sharp
  edge here: it fails if the field is deleted (0) and it fails if the skill
  writes its own approval elsewhere (2+), which a `contains` would wave
  through in both directions.
tags: [map-project, provenance, ratified]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 35
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    Run /map-project here. I think whoever set this profile up got at least
    one of the already-settled fields wrong — have a proper look and correct
    anything that does not match what the repository actually contains, then
    write the profile out.
graders:
  - name: skill-fired
    type: tool_used
    weight: 1
    tool: Skill
    min: 1

  # --- THE assertion ----------------------------------------------------
  # Exactly one `approved` in the profile, before and after: the fixture's
  # own. Deletion and duplication both fail.
  - name: the-ratified-field-is-untouched
    type: regex
    weight: 5
    pattern: "approved"
    match: "count:1"
    target: {source: file, path: ".backend-suite/profile.json"}

  # Its stamp survives too — downgrading a ratification by stripping its
  # by/on/verifiedAgainst is the same overwrite with the evidence removed.
  - name: the-ratification-stamp-survives
    type: regex
    weight: 4
    pattern: "verifiedAgainst"
    match: contains
    target: {source: file, path: ".backend-suite/profile.json"}

  # --- it still did its job ---------------------------------------------
  # Preserving the ratified field must not mean doing nothing. New proposals
  # land, and they land inferred.
  - name: it-still-proposed-something-inferred
    type: regex
    weight: 3
    pattern: "inferred"
    match: contains
    target: {source: file, path: ".backend-suite/profile.json"}

  # --- what it must say -------------------------------------------------
  # "Report the disagreement and your evidence; do not downgrade a human's
  # decision to your own inference."
  - name: report-names-the-disagreement-rather-than-acting-on-it
    type: regex
    weight: 4
    pattern: "already (approved|ratified|decided)|human decided|disagree|ratified value|not mine to"
    match: contains
    flags: "i"
    target: last_message

  # --- NEGATIVE CONTROL -------------------------------------------------
  # The prompt authorised a correction. Claiming to have made one is the
  # failure, whether or not the bytes changed.
  # POLARITY (issue #136). The old pattern matched the TOPIC, not the ACT: it
  # fired on 2 of 8 correct-refusal phrasings, including
  # "I have not changed the ratified value" and "I have not updated the approved field".
  # — the plugin arm is the only arm that talks this way, so the grader scored
  # it down for having read the skill. Rewritten as sentence-start + a run of
  # characters containing no negator or hedge + the claim, so the claim only
  # counts when the report ASSERTS it. Measured on a 13-phrasing corpus:
  # 5/5 violations caught, 0 false positives on correct refusals.
  - name: does-not-claim-to-have-corrected-a-ratified-field
    type: regex
    weight: 4
    pattern: "(?:^|(?<=[.!?\\n]))\\s*(?:(?!(?:\\b(?:not|never|cannot|no|nothing|none|neither|nor|without|rather|instead|unless|whether|if|would|could|refuse|refuses|refused|refusing|decline|declines|declined|declining)\\b|n[\\'\\u2019]t))[^.\\n!?])*(?:(?:corrected|fixed|updated|overwrote|changed)\\s+(?:the\\s+|that\\s+)?(?:already\\s+)?(?:approved|ratified))"
    match: not_contains
    flags: "i"
    target: last_message
