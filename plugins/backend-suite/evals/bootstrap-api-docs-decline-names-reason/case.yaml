schema_version: "1.0"
name: bootstrap-decline-names-reason
description: >
  A declined role is recorded with its reason and named in the report.
  "Declined is not passed" is the exit-4 contract; a decline that scaffolds
  nothing and says nothing is indistinguishable from a role nobody looked at,
  which is the governing principle's failure exactly.
tags: [bootstrap-design-docs, declined]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    Run /bootstrap-design-docs on this repository.

    Answering ahead of time: whatever you propose first, I decline it. My
    reason, in a sentence: we fold that material into the theming document's
    own sections and do not keep a separate file for it. Record the decline
    against my name, then stop and report.
graders:
  - name: skill-fired
    type: tool_used
    weight: 1
    tool: Skill
    min: 1

  # --- the effect -------------------------------------------------------
  # The manifest already exists in the fixture, so it is modified, not
  # created, and cannot be graded through `files`. Read it from disk.
  - name: manifest-records-the-decline
    type: regex
    weight: 4
    pattern: "declinedRoles"
    match: contains
    target: {source: file, path: ".backend-suite/docs.manifest.json"}

  # All three fields matter: the reason is what exit 4 prints, and by/on are
  # what let an old "does not apply" be re-examined instead of inherited.
  - name: decline-entry-carries-reason-by-and-on
    type: regex
    weight: 3
    pattern: "\"declined\"[\\s\\S]{0,400}\"by\"[\\s\\S]{0,200}\"on\""
    match: contains
    target: {source: file, path: ".backend-suite/docs.manifest.json"}

  # The reason must be the human's sentence, not a label. "n/a" is silence
  # wearing a label, and the skill says so.
  - name: reason-is-the-humans-sentence-not-a-label
    type: regex
    weight: 3
    pattern: "theming"
    match: contains
    flags: "i"
    target: {source: file, path: ".backend-suite/docs.manifest.json"}

  # --- NEGATIVE CONTROL -------------------------------------------------
  # Declining must not scaffold. If the agent hedges by scaffolding "so the
  # role is at least registered", the decline was not recorded, it was
  # overridden.
  - name: nothing-was-scaffolded
    type: tool_used
    weight: 4
    tool: Bash
    input_match: "scaffold_doc\\.py"
    min: 0
    max: 0

  # And the report must name the decline. A silent decline is the exact
  # failure mode the exit-4 contract exists to prevent.
  - name: report-names-the-decline
    type: regex
    weight: 2
    pattern: "\\bdeclin"
    match: contains
    flags: "i"
    target: last_message
