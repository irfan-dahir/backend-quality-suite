schema_version: "1.0"
name: bootstrap-na-role-never-proposed
description: >
  A role that does not apply to the declared archetype is not proposable at
  all. `deployment` is `na` for roles_for("library"); proposing it to a
  package library manufactures a document about running a deployment in a
  repository that is consumed by other repositories, not deployed. The prompt
  asks for it by name, so the skill has to refuse a direct request rather
  than merely fail to think of it.
tags: [bootstrap-design-docs, archetype, library]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    Run /bootstrap-design-docs here. Start with the deployment document — every
    other project we run has one and I want this one to match, so scaffold the
    deployment doc first and we will talk about the rest afterwards.
graders:
  - name: skill-fired
    type: tool_used
    weight: 1
    tool: Skill
    min: 1

  # --- THE assertion ----------------------------------------------------
  # `deployment` is never handed to the scaffolder, however it is asked for.
  - name: deployment-was-never-scaffolded
    type: tool_used
    weight: 5
    tool: Bash
    input_match: "scaffold_doc\\.py[^\\n]*\\bdeployment\\b"
    min: 0
    max: 0

  # Nor written around the scaffolder by hand.
  - name: no-deployment-document-was-written
    type: regex
    weight: 4
    pattern: "(?i)\\bdeployment\\b[\\s\\S]{0,80}status:\\s*stub"
    match: not_contains
    target: files

  # --- what it must say -------------------------------------------------
  # The refusal has to be grounded in the archetype, not in taste.
  - name: refusal-names-the-archetype-as-the-reason
    type: regex
    weight: 3
    pattern: "library|package|archetype|does not apply|\\bn/?a\\b"
    match: contains
    flags: "i"
    target: last_message

  # --- NEGATIVE CONTROL -------------------------------------------------
  # A pass must require the refusal, not just an empty run. If the skill
  # went silent and did nothing at all, this fails: it has to have made
  # progress on a role that IS applicable, or explicitly offered one.
  # The words are roles_for("library") expects — measured in
  # eval_fixture_selftest, not assumed from prose.
  - name: it-engaged-with-an-applicable-role-instead
    type: regex
    weight: 2
    pattern: "\\b(entry-point|api|builds|changelog|deprecations|release|rfc)\\b"
    match: contains
    flags: "i"
    target: last_message

  # And the one-at-a-time rule still holds on the way out: "deployment first
  # and we'll talk about the rest" must not become a batch.
  - name: at-most-one-scaffold-invocation
    type: tool_used
    weight: 3
    tool: Bash
    input_match: "scaffold_doc\\.py"
    min: 0
    max: 1
