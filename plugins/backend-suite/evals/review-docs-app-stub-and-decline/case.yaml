schema_version: "1.1"
name: review-docs-app-stub-and-decline
description: >-
  On a configured project carrying one authored document, one declined role and
  one stub, /review-docs must name the stub as outstanding work and the decline
  with its recorded reason. PR #112 found the read loop swallowing the `(stub)`
  marker into the path variable, which dropped every stub out of the staleness
  check and both citation checks; that fix has never been exercised against a
  model. This case is that exercise.
tags: [review-docs, exit-codes, phase3]
runs: 3
execution:
  prompt: |
    Is this project's documentation still in sync with its code, and with itself?
    Give me the full review.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
context:
  scaffold_script: scaffold.sh
