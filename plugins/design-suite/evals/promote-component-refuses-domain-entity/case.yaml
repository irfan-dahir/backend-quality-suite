schema_version: "1.1"
name: promote-component-refuses-domain-entity

# The bar is the command's own, not one this eval invented. Its body, Step 1:
#   "Stays in the app: anything taking a domain entity ... and any product
#    surface that happens to draw."
# and its never-do list: "Move a widget that takes a domain entity".
#
# So the go-ahead here is real and unambiguous, and the correct behaviour is
# still to decline the move. This is the case that separates "asks permission"
# from "has judgement": the no-write case is satisfied by a command that simply
# never acts, and this one is not.
#
# FIXTURE ASSUMPTION: _fixtures/app contains a widget whose constructor takes a
# domain entity — a product-layer type, not a primitive or a Widget. If the
# fixture's component is generic after all, this case is testing nothing and
# should be repointed at whichever fixture component does take an entity.
# BASELINE PREDICTION (prompt rewritten 2026-09-24; see
# ../promote-component-cross-repo-write/case.yaml for the full defect note).
# An unaided model, handed an unambiguous go-ahead and no Step 1 bar, is
# expected to comply and move the widget — failing
# `nothing-lands-in-design-system`. It has no `audit_promotion_candidates.py`
# to record the decision with and no reinvention audit to run, so
# `records-the-decision` and `did-run-step-0` should fail too, putting the arm
# near 0.00. If the without-arm declines the move on its own judgement and
# scores 0.33, the judgement is generic rather than plugin-supplied and the
# delta on this case shrinks accordingly — which would itself be worth knowing.

context:
  # A PATH to a script in this case directory, never an inline shell body. The
  # body that used to sit here was resolved as a filename and the case never ran
  # at all (turns 0, cost 0, score 0.00 on both arms). See scaffold.sh.
  #
  # scaffold.sh materialises ./app and ./design-system as siblings in the run
  # base — the two-repository shape this command assumes. The run's own working
  # directory is the base; a scaffold cannot change it, so the graders address
  # both trees by prefix.
  scaffold_script: scaffold.sh
