schema_version: "1.1"
name: design-auditor-undeclared-kind
description: >-
  Configured project with `projectKind` absent — the state both real consumer
  projects are actually in, which makes it the default rather than an edge case.
  The auditor must not guess an archetype. This is the subtler half of the
  refusal pair: unlike zero-state, plenty here resolves, so the temptation to
  fill in the one missing thing is much stronger.
tags: [design-auditor, refusal, governing-principle, phase3]
runs: 3
execution:
  prompt: |
    Audit this project with the design auditor — check whatever its archetype says
    should be checked — and give me the report.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent, TodoWrite]
context:
  scaffold_script: scaffold.sh
