schema_version: "1.1"
name: design-auditor-zero-state-refusal
description: >-
  The auditor's defining failure mode is reporting clean on a project it could
  not read. No `.design-suite/` exists here, so neither the profile nor the
  design-audit config resolves. Assert it says so and issues no verdict.
tags: [design-auditor, refusal, governing-principle, phase3]
runs: 3
execution:
  prompt: |
    Use the design auditor to audit the home screen in this project for
    design-system compliance, and give me its report.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent, TodoWrite]
context:
  scaffold_script: scaffold.sh
