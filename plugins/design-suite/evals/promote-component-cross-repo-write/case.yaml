schema_version: "1.1"
name: promote-component-cross-repo-write

# CAN A CROSS-REPOSITORY WRITE BE EXERCISED SAFELY IN THE SANDBOX? Yes — but
# only between two fixture directories, never between two real checkouts, and
# the reason is a hard constraint rather than a stylistic preference.
#
# Each run gets a throwaway workspace with a fresh HOME and CLAUDE_CONFIG_DIR,
# and the shell tools are filesystem-confined to that run base; the CLI refuses
# an `add_dirs` entry that "resolves outside case/plugin". So there is no
# supported way to hand a run a second checkout living elsewhere on the
# machine. Pointing the command at a developer's real design-system clone is
# not something this harness will do, and faking it by writing to an absolute
# path outside the base would either be blocked or — worse, if it were not —
# would mutate a real repository from a test.
#
# What is both safe and sufficient: copy BOTH fixtures into the run base as
# siblings and let the command move code from one to the other. The repository
# boundary the command has to respect is a directory boundary, and a directory
# boundary inside the sandbox exercises it faithfully. What this does NOT
# exercise is anything requiring two real git remotes — branch creation against
# an upstream, or the DS repo's actual CI gates. Those stay untested here, and
# that gap is real rather than papered over.
context:
  # A PATH to a script in this case directory, never an inline shell body. The
  # body that used to sit here was resolved as a filename and the case never ran
  # at all (turns 0, cost 0, score 0.00 on both arms). See scaffold.sh.
  #
  # scaffold.sh materialises ./app and ./design-system as siblings in the run
  # base — the two-repository shape this command assumes. The run's own working
  # directory is the base; a scaffold cannot change it, so the graders address
  # both trees by prefix.
  scaffold_script: scaffold.sh

# WITHOUT-PLUGIN ARM — what it used to measure, and what it should measure now.
#
# It used to measure nothing. The prompt opened with a bare
# `/promote-component StatCell`; with the plugin absent that slash command does
# not resolve, so every without-plugin run of this case ended at 0 turns, $0.00
# and ~2 seconds without the model taking a turn. Its score was not a baseline
# the plugin had to beat — it was the fraction of this case's graders that an
# empty run satisfies for free. The same was true of all four
# `promote-component` cases: on 2026-09-18T03-06-49-269Z and again on the
# 2026-09-23/24 batch, every one of them recorded 0 turns on every
# without-plugin run, and their `delta` values were not interpretable.
#
# The prompt is now plain language and names no slash command, so an unaided
# model has a task it can attempt. This is the fix the previous note left as
# stated work. The corrected prompts are UNMEASURED — the next run is what
# shows whether the baseline now acts.
#
# BASELINE PREDICTION: an unaided model should write a StatCell file into
# `./design-system` (passing `write-crosses-the-boundary`) and stay inside the
# run base (passing `stays-inside-the-run-base`), but should NOT run the
# suite's Step 0 reinvention audit, which does not exist without the plugin —
# so `did-run-step-0` should fail and the arm should land near 0.67. A
# without-arm scoring 1.00 here means the prompt gave away Step 0 and this note
# is how the next person notices.
#
# `did-run-step-0` lowers this case's free-score floor from 0.50 to 0.33 and
# makes inaction visible per-grader. It does NOT remove it: scoring is the
# weighted fraction of graders passed, and no absence grader can be made
# conditional on a liveness grader in that scheme. That residual is a property
# of the scoring scheme, not of these prompts.
